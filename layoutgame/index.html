<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Layout Game</title>
<meta name="description" content="The Layout Game: check survey stakes against the plans and the cut sheet. Find missing stakes, wrong cuts, bad offsets, hubs in the wrong spot and disturbed hubs.">
<meta name="theme-color" content="#0E2A3B">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#F3F6F8;--card:#FFFFFF;--card2:#F7F9FB;--ink:#0B1B2B;--ink2:#3A4D60;--ink3:#5C6F82;--line:#D5DDE4;--brand:#0E2A3B;--acc:#F2A900;--accInk:#1F1500;
 --ok:#177245;--okbg:#E3F4EA;--bad:#B42318;--badbg:#FDE8E6;--focus:#1D6FD8;--wood:#E7CB9C;--wood2:#D6B47E;--woodInk:#16110A;--sel:#FFE38A;--paper:#FBFAF4;--draw:#1B2A38;--dirt:#C9A77A;--dirt2:#B8946A;
 --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color-scheme:light}
:root[data-theme="dark"]{--bg:#0B141C;--card:#13212D;--card2:#182A38;--ink:#EEF3F8;--ink2:#C3D0DC;--ink3:#A3B4C4;--line:#2A3D4E;--brand:#0A1F2D;
 --ok:#5BD08F;--okbg:#123726;--bad:#FF8A80;--badbg:#3D1A18;--focus:#7FB8FF;--sel:#FFD45C;--paper:#101C26;--draw:#D7E3EE;--dirt:#5A4630;--dirt2:#4A3926;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B141C;--card:#13212D;--card2:#182A38;--ink:#EEF3F8;--ink2:#C3D0DC;--ink3:#A3B4C4;--line:#2A3D4E;--brand:#0A1F2D;
 --ok:#5BD08F;--okbg:#123726;--bad:#FF8A80;--badbg:#3D1A18;--focus:#7FB8FF;--sel:#FFD45C;--paper:#101C26;--draw:#D7E3EE;--dirt:#5A4630;--dirt2:#4A3926;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
html.big{font-size:19px}
html.big .lath3 .lm{font-size:18px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--acc);color:var(--accInk);padding:8px 12px;border-radius:8px;font-weight:700;z-index:50}
.skip:focus{left:8px}
header.app{background:var(--brand);color:#F1F5F8;display:flex;align-items:center;gap:12px;padding:10px 18px;position:sticky;top:0;z-index:20}
.logo{width:40px;height:40px;border-radius:10px;background:var(--acc);display:grid;place-items:center;flex:none}
.brand b{display:block;font-size:18px;line-height:1.2}
.brand span{display:block;font-size:13px;color:#C9D8E4}
.sp{flex:1}
.hb{height:38px;padding:0 12px;border-radius:10px;border:1px solid #3B5A70;background:#163447;color:#F1F5F8;font:600 14px var(--sans);cursor:pointer}
.hb[aria-pressed="true"]{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
main{max-width:1320px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:1.6rem;margin:0;line-height:1.2}
h2{font-size:1.2rem;margin:0 0 10px}
h3{font-size:1.02rem;margin:14px 0 6px}
.sub{margin:4px 0 0;color:var(--ink2)}
.small{font-size:.9rem;color:var(--ink2);margin:4px 0}
.mono{font-family:var(--mono)}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:10px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;height:42px;padding:0 10px}
input[aria-invalid="true"]{border-color:var(--bad)}
.btn{height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--acc);background:var(--acc);color:var(--accInk);font:700 15px var(--sans);cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.big{height:50px;font-size:17px;padding:0 22px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.how{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:14px}
.how summary{cursor:pointer;font-weight:700}
.how ol{margin:6px 0 4px;padding-left:22px}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.plan{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:8px}
.plan .pt{font:700 15px var(--mono);fill:var(--draw)}
.plan .t{font:600 13px var(--mono);fill:var(--draw)}
.plan .gt{font-size:12px;opacity:.75}
.plan .pl{stroke:var(--draw);stroke-width:3;fill:none}
.plan .pl2{stroke:var(--draw);stroke-width:1.5;fill:none}
.plan .off{stroke:#D97706;stroke-width:2;stroke-dasharray:8 5}
.plan .tk,.plan .lead{stroke:var(--draw);stroke-width:1.5;fill:none}
.plan .sym{fill:var(--draw)}
.plan .sym2{fill:var(--paper);stroke:var(--draw);stroke-width:2}
.plan .gl{stroke:var(--draw);stroke-width:.6;opacity:.25}
.plan .gr{stroke:#8A6A3C;stroke-width:2.5;fill:none}
.plan .pipe{stroke:#1D6FD8;stroke-width:4}
.plan .mh{fill:none;stroke:var(--draw);stroke-width:2}
.plan .tb{fill:none;stroke:var(--draw);stroke-width:1.5}
.plan .bc{stroke:var(--draw);stroke-width:3;fill:none}
.plan .fl{stroke:var(--draw);stroke-width:1.5;fill:none}
.plan .cl{stroke:#1D6FD8;stroke-width:1.5;stroke-dasharray:10 4 2 4;fill:none}
.plan .water{stroke:#2F7FE0;stroke-width:4;fill:none}
.plan .gl{stroke:var(--draw);stroke-width:1;stroke-dasharray:12 4 2 4}
.plan .gl2{stroke:var(--draw);stroke-width:.6;opacity:.25}
.plan .bldg{fill:rgba(120,140,160,.15);stroke:var(--draw);stroke-width:2.5}
.plan .pad{fill:rgba(201,167,122,.25);stroke:var(--draw);stroke-width:2.5}
.plan .bub{fill:var(--paper);stroke:var(--draw);stroke-width:1.5}
.plan .vlv{fill:var(--draw)}
.plan .rpm line{stroke:#B42318;stroke-width:2}
.plan polyline.pipe{fill:none}
table{border-collapse:collapse;width:100%;font-size:.95rem}
caption{text-align:left;font-weight:700;padding:10px 0 6px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
thead th{background:var(--card2);font-size:.85rem}
.req{margin:0;padding-left:20px}
.tabs{display:flex;gap:6px;margin:0 0 10px}
.tab{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font:700 15px var(--sans);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.cs td,.cs th{white-space:nowrap}
.fwrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
.field{position:relative;width:100%;min-width:460px;background:repeating-linear-gradient(115deg,var(--dirt) 0 18px,var(--dirt2) 18px 22px)}
.fsvg{position:absolute;inset:0;width:100%;height:100%}
.fsvg .ff{fill:none;stroke:rgba(255,255,255,.55);stroke-width:2;stroke-dasharray:6 6}
.fsvg circle.ff,.fsvg rect.ff,.fsvg path.ff{stroke:rgba(255,255,255,.55)}
.eqband{min-width:460px;background:linear-gradient(#BFD9EC,#DCEAF3);height:74px;overflow:hidden;border-bottom:4px solid var(--dirt2)}
:root[data-theme="dark"] .eqband{background:linear-gradient(#0E2236,#1A3550)}
.equip{width:100%;height:74px;display:block}
@media (prefers-reduced-motion:no-preference){.eq{animation:drive 14s ease-in-out infinite alternate}.e2{animation-duration:18s}.e3{animation-duration:11s}.e4{animation-duration:16s}}
@keyframes drive{from{transform:translateX(-30px)}to{transform:translateX(40px)}}
.fs{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;background:transparent;border:2px solid transparent;border-radius:8px;padding:1px 2px;cursor:pointer;z-index:2}
.fs svg{transform-origin:bottom center;display:block}
.fs.lean svg{transform:rotate(16deg)}
.fs .fl{order:-1;font:700 12px var(--mono);color:#1A140C;background:rgba(255,255,255,.85);padding:0 3px;border-radius:4px;margin-bottom:1px;white-space:nowrap}
.fs:hover{border-color:rgba(0,0,0,.4)}
.fs.sel{background:var(--sel);border-color:#7A5A00;z-index:3}
.fs .bd{position:absolute;top:-8px;right:-10px;width:20px;height:20px;border-radius:50%;font:800 12px var(--sans);display:grid;place-items:center;background:#177245;color:#fff}
.fs.flagged .bd{background:#B42318}
.tape{margin-top:10px}
.tape .row label{font-weight:600}
.tlog{margin:4px 0 0;padding-left:20px}
.tlog li:first-child{font-weight:700}
.missrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 4px}
.missrow label{font-weight:600}
.chip{font:600 13px var(--sans);border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
#panel{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
.empty{color:var(--ink2);font-style:italic}
.cond{font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.hint summary{cursor:pointer;color:var(--ink2);font-weight:600}
.hint p{font-family:var(--mono);font-size:.92rem;background:var(--card2);border-radius:8px;padding:8px 10px;margin:6px 0}
fieldset.call{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:10px 0}
fieldset.call legend{font-weight:700;padding:0 4px}
fieldset.call label{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer}
fieldset.call input{width:20px;height:20px;margin:0}
.finish{margin-top:16px}
.finish fieldset.q{display:inline-block;vertical-align:top;margin-right:10px;min-width:260px}
.res{margin-top:16px;border-left:6px solid var(--acc)}
.kpis{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 10px}
.kpi{flex:1;min-width:150px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kv{display:block;font:800 1.4rem var(--sans)}
.kl{display:block;font-size:.85rem;color:var(--ink2)}
.kpi.good .kv{color:var(--ok)} .kpi.bad .kv{color:var(--bad)}
.calls{padding-left:20px}
.calls li.y strong{color:var(--ok)} .calls li.n strong{color:var(--bad)}
.tscroll{overflow-x:auto}
.rt tr.y th{border-left:5px solid var(--ok)} .rt tr.n th{border-left:5px solid var(--bad)}
.codebox{background:var(--card2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.clean{background:var(--okbg);border-radius:10px;padding:10px 12px}
footer{max-width:1320px;margin:0 auto;padding:0 16px 30px;color:var(--ink2);font-size:.9rem}
footer details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:10px}
footer summary{cursor:pointer;font-weight:700;color:var(--ink)}
/* lath, same as Stake Reader */
.stage{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:16px 12px 0;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.scene2{display:flex;align-items:stretch;justify-content:center;gap:22px;margin-bottom:-14px}
.scene2.lean .lface{transform:rotate(5deg);transform-origin:bottom center}
.lface{display:flex;flex-direction:column;align-items:center}
.llab{font:800 12px var(--sans);letter-spacing:.12em;color:var(--ink2);margin-bottom:6px}
.lath3{flex:1;width:84px;min-height:250px;background:linear-gradient(90deg,var(--wood2),var(--wood) 14%,var(--wood) 86%,var(--wood2));border:1px solid #9C7A45;border-bottom:0;border-radius:3px 3px 0 0;padding:8px 4px 16px;display:flex;flex-direction:column;align-items:center}
.ztop,.zbody{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%}
.fband{width:116px;height:24px;margin:4px 0 6px}
.fwave{width:116px;height:100%;overflow:visible}
.lath3 .lm{color:var(--woodInk);font:800 16px/1.15 var(--mono);padding:3px 2px;display:flex;flex-direction:column;align-items:center;max-width:100%}
.lath3 .lm.la{width:100%}
.lath3 .lm .ac{display:block;text-align:center;overflow-wrap:anywhere}
.lath3 .lm .circ{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 3px;border:2px solid var(--woodInk);border-radius:50%;font-size:14px}
.lath3 .lm .vt{writing-mode:vertical-rl;text-orientation:mixed;white-space:nowrap;display:inline-block;padding:2px 0}
.lath3 .lm .dc{font-size:12px;line-height:1;display:inline-block}
.lath3 .lm .vt .dc{vertical-align:super;border-left:2px solid currentColor;padding-left:1px;margin-left:1px}
.lath3 .lm .ac .dc{vertical-align:super;border-bottom:2px solid currentColor}
.tip2{width:0;height:0;border-left:42px solid transparent;border-right:42px solid transparent;border-top:22px solid var(--wood2)}
.hubbox{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding-bottom:16px}
.hublab{font-size:12px;font-weight:800;color:var(--ink2)}
.hub{width:30px;height:24px;background:#C89B5E;border:2px solid #6E5230;border-radius:3px;position:relative}
.hub::after{content:"";position:absolute;left:11px;top:7px;width:6px;height:6px;border-radius:50%;background:#555}
.hub.chew{transform:rotate(-12deg);border-style:dashed}
.ground{align-self:stretch;height:22px;background:repeating-linear-gradient(115deg,var(--dirt) 0 14px,var(--dirt2) 14px 18px)}
@media (max-width:600px){h1{font-size:1.3rem}.brand span{display:none}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the game</a>
<header class="app">
 <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#1F1500" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h10l4 4v12H4z"/><path d="M14 4v4h4"/><path d="M8 14l2.5 2.5L16 11"/></svg></div>
 <div class="brand"><b>The Layout Game</b><span>Check the stakes against the plans</span></div>
 <div class="sp"></div>
 <button class="hb" id="bigB" aria-pressed="false">Big text</button>
 <button class="hb" id="themeB">Dark</button>
</header>
<main id="main"></main>
<footer>
 <p>Developed by Jeff Weygandt, PLS. R&amp;R Engineers | Surveyors. Construction Management, Community College of Aurora and Metropolitan State University of Denver. Stake format follows Construction Layout &amp; Survey Control.</p>
</footer>
<script>
/* ===== The Layout Game: check the stakes against the plans ===== */
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS={pink:'#F06FA8',green:'#2FA35A',orange:'#FF8A1F',white:'#F4F4F2',blue:'#2F7FE0'};
const f2=v=>(Math.round(v*100)/100).toFixed(2);
const r2=v=>Math.round(v*100)/100;
const staS=s=>{s=r2(s);const a=Math.floor(s/100),b=r2(s-a*100);return a+'+'+(b<10?'0':'')+(Number.isInteger(b)?String(b):b.toFixed(2));};
const money=n=>'$'+Math.round(n).toLocaleString('en-US');
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ===== lath drawing, same format as Stake Reader and the book ===== */
const T=(r)=>({z:'top',r:[].concat(r)});
const V=(t)=>({z:'body',r:[t]});
const O=(ft)=>({z:'top',circ:true,r:[ft]});
function decHTML(t){return esc(t).replace(/(\d)\.(\d{2,3})(?!\d)/g,'$1<span class="dc">$2</span>');}
function waveSVG(c){const col=COLORS[c];return '<svg class="fwave" viewBox="0 0 120 18" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="M2 8 C 22 1, 38 15, 60 8 S 98 1, 118 8" fill="none" stroke="#5A4A30" stroke-width="9" stroke-linecap="round" opacity=".35"/><path d="M2 8 C 22 1, 38 15, 60 8 S 98 1, 118 8" fill="none" stroke="'+col+'" stroke-width="7" stroke-linecap="round"/></svg>';}
function topH(ms){return ms.filter(m=>m.z==='top').reduce((h,m)=>h+(m.circ?40:m.r.length*19+6),0);}
function markHTML(m){const full=m.r.join(' ');let inner;
 if(m.circ)inner='<span class="circ">'+esc(m.r[0])+'</span>';
 else if(m.z==='top')inner=m.r.map(x=>'<span class="ac">'+decHTML(x)+'</span>').join('');
 else inner='<span class="vt">'+decHTML(m.r[0])+'</span>';
 return '<div class="lm '+(m.circ?'lc':m.z==='top'?'la':'lv')+'" role="text" aria-label="'+esc(full)+'">'+inner+'</div>';}
function faceHTML(label,marks,flag,th){const top=marks.filter(m=>m.z==='top'),body=marks.filter(m=>m.z!=='top');
 return '<div class="lface"><div class="llab">'+label+'</div><div class="lath3"><div class="ztop" style="min-height:'+th+'px">'+top.map(markHTML).join('')+'</div><div class="fband">'+waveSVG(flag)+'</div><div class="zbody">'+body.map(markHTML).join('')+'</div></div><div class="tip2" aria-hidden="true"></div></div>';}
function stakeHTML(st,flag){const th=Math.max(topH(st.front),topH(st.back));
 return '<div class="scene2'+(st.bumped?' lean':'')+'" role="group" aria-label="Lath for point '+st.pt+', '+esc(st.name)+', front and back">'+faceHTML('FRONT',st.front,flag,th)+faceHTML('BACK',st.back,flag,th)+'<div class="hubbox" aria-hidden="true"><span class="hublab">HUB</span><div class="hub'+(st.bumped?' chew':'')+'"></div></div></div><div class="ground" aria-hidden="true"></div>';}

/* ===== styles and difficulty ===== */
const STYLES=[
 {id:'curb',name:'Curb and gutter',tag:'Curb return with a 20 ft radius'},
 {id:'storm',name:'Storm drain',tag:'Pipe and an area inlet with four hubs'},
 {id:'san',name:'Sanitary sewer',tag:'Manholes with two offset stakes each'},
 {id:'water',name:'Waterline',tag:'Cut to top of pipe'},
 {id:'grid',name:'Building grid',tag:'Offset hubs on grid lines, ±0.02 ft'},
 {id:'pad',name:'Rough grade pad',tag:'RG corner and edge stakes'},
 {id:'pond',name:'Pond slope stakes',tag:'Story calls and progressive calls'}
];
const DIFFS=[
 {id:1,name:'Level 1',desc:'1 or 2 problems. Lath copied wrong or a stake missing. The cut sheet is right.',n:[1,2],types:['cut','missing','offset']},
 {id:2,name:'Level 2',desc:'2 or 3 problems. Adds hubs set in the wrong spot and hubs that got hit. Bring the tape.',n:[2,3],types:['cut','missing','offset','bumped','tape','tape','mhcut']},
 {id:3,name:'Level 3',desc:'3 or 4 problems. The cut sheet itself can be wrong, or built on an old revision.',n:[3,4],types:['cut','missing','offset','bumped','tape','mhcut','sheetcut','sheetcut','sheetpos','rev','rev']},
 {id:4,name:'Wildcard',desc:'Any style, any level, and it might be clean.',n:[0,3],types:['cut','missing','offset','bumped','tape','mhcut','sheetcut','sheetpos','rev']}
];
const REASONS=[['ok','Looks good'],['cut','Cut or fill does not match the plan'],['offset','Offset does not match the request'],['tape','Hub is in the wrong spot (tapes wrong)'],['bumped','Hub was disturbed'],['rev','Built to an old plan revision']];
const RNAME={cut:'Cut or fill does not match the plan',sheetcut:'Cut or fill does not match the plan',mhcut:'Cut or fill does not match the plan',offset:'Offset does not match the request',tape:'Hub is in the wrong spot',sheetpos:'Hub is in the wrong spot',bumped:'Hub was disturbed',rev:'Built to an old plan revision',missing:'Missing stake'};
const COST={cut:6500,sheetcut:7500,mhcut:8500,offset:4200,tape:5800,sheetpos:7800,bumped:5200,rev:9000,missing:2400};
const CALLBACK=350;
const OKR={cut:['cut'],sheetcut:['cut'],mhcut:['cut'],offset:['offset'],tape:['tape','bumped'],sheetpos:['tape'],bumped:['bumped','tape'],rev:['rev','cut']};

/* ===== stake builder ===== */
let PT=100;
function gtxt(d,label,curb){const v=f2(Math.abs(d));return curb?(d>0?'C-':'F+')+v+' '+label:(d>0?'C ':'F ')+v+' '+label;}
/* o: {name,k,pos,sta,off,offTxt,top,grades:[{d,lab,des,rev}],extra,noEl,canMiss,tapeable,tref,curb,date} */
function mk(R,o){const st=Object.assign({id:'s'+(++PT),pt:R.ptBase+(PT%100),hub:o.hub},o);
 st.tpos={x:o.pos.x,y:o.pos.y};

function wrongVal(v,r){const s=f2(Math.abs(v)),a=s.split('.');

function callText(R,st,g,i,c){if(R.style!=='pond')return gtxt(c,g.lab,R.curb);const txt=st.front[g.mi].r[0];return txt.replace(/[CF] \d+\.\d\d$/,(c>0?'C ':'F ')+f2(Math.abs(c)));}
function plant(t,R,r,pick,U,used){

 if(t==='missing')c=free.filter(x=>x.canMiss);

 else if(t==='mhcut')c=free.filter(x=>x.k==='mh1');
 else if(t==='offset')c=free.filter(x=>x.off&&x.offTxt!==null);
 else if(t==='tape'||t==='bumped')c=free.filter(x=>x.tapeable&&x.tref&&!used.has(x.tref));
 else if(t==='sheetpos')c=R.coords?free.filter(x=>x.tapeable&&x.tref&&!used.has(x.tref)):[];
 else if(t==='rev')c=R.revFix&&!R.rev?free.filter(x=>x.grades.some(g=>g.rev)):[];
 if(!c.length)return false;
 const st=pick(c);let e={t,ids:[st.id],name:st.name,ord:R.stakes.indexOf(st),cost:COST[t]*(R.curb?0.5:1)};
 const unit=R.what?R.what:'';
 if(t==='missing'){st.removed=true;e.src='none';e.why='No stake at '+st.name+'. The request calls for one here, so there is nothing to build from.';}
 if(t==='cut'){const gi=st.grades.length>1&&r()<0.5?1:0,g=st.grades[gi];const sc=g.shownCut!=null?g.shownCut:g.cut;
  let wtxt,why;const flip=Math.abs(sc)>=0.05&&Math.abs(sc)<0.6&&r()<0.35;
  if(flip){const wc=-sc;wtxt=callText(R,st,g,gi,wc);why='Cut and fill are flipped. The number is right, the letter is wrong.';}
  else{const w=wrongVal(sc,r);wtxt=callText(R,st,g,gi,sc>0?+w.v:-w.v);why=w.why;}
  const right=st.front[g.mi].r[0];setMark(st,g,wtxt);
  e.src='lath';e.why='The cut sheet is right but the lath was copied wrong. Sheet and plan say '+right+', the lath says '+wtxt+'. '+why;}
 if(t==='sheetcut'){const gi=st.grades.length>1?Math.floor(r()*Math.min(2,st.grades.length)):0,g=st.grades[gi];const bump=pick([0.10,-0.10,1.00,-1.00]);
  const wd=r2(g.des+bump);const prevDes=R.style==='pond'&&R.prog?(gi===0?st.hub:st.grades[gi-1].des):st.hub;const wc=r2(prevDes-wd);

  e.src='lath';e.why='The cut sheet is right but the lath was copied wrong. INV IN cut is '+f2(gIn.cut)+' and INV OUT says '+f2(w)+', so the outlet would sit 0.12 ft above the inlet. Correct INV OUT cut is '+f2(gOut.cut)+'.'+(R.style==='san'?' The other offset stake on this manhole has it right, so the two disagree.':'');}
 if(t==='offset'){const right=st.offTxt||(st.off+"'");const w=/x/.test(right)?"3'x3'":st.off===10?"6'":st.off===3?"5'":st.off===5?"10'":st.off===6?"10'":"10'";st.front[0]=O(w);

  const mag=t==='sheetpos'?1.00:t==='bumped'?r2(U(0.15,0.4)):(R.style==='grid'?r2(U(0.05,0.15)):r2(U(0.35,0.9)));

  hits.forEach(h=>{used.add(h.id);});e.ids=hits.map(h=>h.id);const g=st.grades.find(g=>g.rev);

 e.ids.forEach(id=>used.add(id));st.err=e;if(t==='rev')R.stakes.filter(x=>e.ids.includes(x.id)).forEach(x=>x.err=e);

 let st=style,df=diff;
 if(diff===4){const rr=rng(code*31+7);st=STYLES[Math.floor(rr()*STYLES.length)].id;}
 G.style=style;G.diff=diff;
 G.R=gen(st,diff,code);G.R.pickStyle=style;G.sel=null;G.missing=[];G.calls={};
 try{localStorage.setItem('layoutgame.sd',style+'|'+diff);}catch(e){}
 render();const h=$('#roundH');if(h)h.focus();}
function render(){const R=G.R,S=STYLES.find(s=>s.id===R.style),D=DIFFS.find(d=>d.id===R.diff);
 $('#main').innerHTML=
 '<div class="topbar"><div><h1 id="roundH" tabindex="-1">'+esc(S.name)+', '+esc(D.name)+'</h1><p class="sub">'+esc(R.title)+'. '+esc(D.desc)+' Round code <strong class="mono">'+R.code+'</strong></p></div>'+
 '<div class="tools"><label class="sr" for="stSel">Staking style</label><select id="stSel">'+STYLES.map(s=>'<option value="'+s.id+'"'+(s.id===G.style?' selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select>'+
 '<label class="sr" for="dfSel">Difficulty</label><select id="dfSel">'+DIFFS.map(d=>'<option value="'+d.id+'"'+(d.id===G.diff?' selected':'')+'>'+esc(d.name)+'</option>').join('')+'</select><button class="btn" id="newB">New round</button>'+
 '<label class="sr" for="codeIn">Play a round code</label><input id="codeIn" inputmode="numeric" maxlength="4" placeholder="Code" size="5"><button class="btn ghost" id="codeB">Play code</button></div></div>'+
 '<details class="how"><summary>How to play</summary><ol><li>Read the plan sheet, the staking request and the crew\'s cut sheet. The cut sheet can be wrong too.</li><li>Tap each stake in the field. Read the front and back, then make your call on it.</li><li>Tape between two hubs to check the layout. Compare it to the dimensions on the plan.</li><li>Use a level shot to check a hub that looks wrong. You get 3.</li><li>Mark any stake the request calls for that is not there.</li><li>Answer the five calls and finish. Every problem you miss costs rework. Every false alarm costs a crew callback ('+money(CALLBACK)+').</li></ol></details>'+
 '<div class="grid"><section class="card planc" aria-labelledby="planH"><h2 id="planH">Plans and cut sheet</h2><div class="tabs"><button class="tab" id="tabP" aria-pressed="'+(G.tab!=='cs')+'" aria-controls="paneP">Plan sheet</button><button class="tab" id="tabC" aria-pressed="'+(G.tab==='cs')+'" aria-controls="paneC">Crew\'s cut sheet</button></div>'+
 '<div id="paneC"'+(G.tab==='cs'?'':' hidden')+'>'+sheetHTML(R)+'</div><div id="paneP"'+(G.tab==='cs'?' hidden':'')+'>'+planSVG(R)+
 '<table class="notes"><caption>Plan notes, '+esc(R.title)+(R.rev?', revision 2':'')+'</caption><thead><tr><th scope="col">Design item</th><th scope="col">Station</th><th scope="col">Value</th></tr></thead><tbody>'+R.notes.map(n=>'<tr><th scope="row">'+esc(n[0])+'</th><td>'+esc(n[1]||' ')+'</td><td class="mono">'+esc(n[2])+'</td></tr>').join('')+'</tbody></table>'+
 (R.design.length?'<table class="notes"><caption>Design grades</caption><thead><tr><th scope="col">Where</th><th scope="col">Item</th><th scope="col">Design</th></tr></thead><tbody>'+R.design.map(d=>'<tr><th scope="row">'+esc(d.name)+'</th><td>'+esc(d.d)+'</td><td class="mono">'+f2(d.des)+'</td></tr>').join('')+'</tbody></table>':'')+
 '<h3>Staking request</h3><ul class="req">'+R.request.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div></section>'+
 '<section class="card fieldc" aria-labelledby="fieldH"><h2 id="fieldH">In the field</h2><p class="small">'+R.stakes.length+' stakes set. Tap a stake to read it. Labels are point numbers. Level shots left: <strong id="shotsN">'+R.shots+'</strong></p><div class="fwrap">'+fieldHTML(R)+'</div>'+
 '<div class="tape"><h3>Tape a distance</h3><div class="row"><label for="tA">From</label><select id="tA">'+stakeOpts()+'</select><label for="tB">To</label><select id="tB">'+stakeOpts(1)+'</select><button class="btn ghost" id="tapeB">Tape it</button></div><ul id="tapeLog" class="tlog" aria-live="polite">'+tapeLog()+'</ul></div>'+
 '<div class="missrow"><label for="missSel">Missing stake</label><select id="missSel">'+R.req.map(q=>'<option value="'+q.id+'">'+esc(q.name)+'</option>').join('')+'</select><button class="btn ghost" id="missB">Mark missing</button></div>'+
 '<div id="missList" aria-live="polite">'+missListHTML()+'</div><div id="panel">'+panelHTML()+'</div></section></div>'+
 '<section class="card finish" aria-labelledby="finH"><h2 id="finH">Your calls</h2>'+callsHTML()+'<div class="row"><button class="btn big" id="finB">Finish the check</button><span class="small" id="finMsg" aria-live="polite"></span></div></section><div id="results"></div>';
 wire();}
function stakeOpts(sel){return G.R.stakes.map((s,i)=>'<option value="'+i+'"'+(sel&&i===1?' selected':'')+'>'+s.pt+', '+esc(s.name)+'</option>').join('');}
function tapeLog(){return G.R.tapes.map(t=>'<li><span class="mono">'+f2(t.d)+' ft</span> '+esc(t.a)+' to '+esc(t.b)+'</li>').join('');}
function sheetHTML(R){const rows=[];const co=!!R.coords;
 R.stakes.forEach(st=>{const p=st.sheetPos||st.pos;const base='<th scope="row">'+st.pt+'</th><td>'+esc(st.name)+'</td><td>'+(st.offTxt||st.off+"'")+'</td>';
  if(!st.grades.length){rows.push('<tr>'+base+(co?'<td class="mono">'+f2(p.x+1000)+'</td><td class="mono">'+f2(p.y+5000)+'</td>':'')+'<td>'+esc(st.top.join(' '))+'</td><td></td><td></td></tr>');return;}
  st.sheet.forEach((l,j)=>rows.push('<tr>'+(j?'<th scope="row"><span class="sr">'+st.pt+'</span></th><td></td><td></td>':base)+(co?(j?'<td></td><td></td>':'<td class="mono">'+f2(p.x+1000)+'</td><td class="mono">'+f2(p.y+5000)+'</td>'):'')+'<td>'+esc(l.d)+'</td><td class="mono">'+f2(l.des)+(j?'':' / '+f2(st.hub))+'</td><td class="mono">'+(l.cut>0?'C ':'F ')+f2(Math.abs(l.cut))+'</td></tr>'));});
 return '<p class="small">The crew\'s cut sheet for this layout. Is it right? And does each lath match it?'+(co?' Coordinates are local: east and north in feet.':'')+'</p><div class="tscroll"><table class="notes cs"><caption>Crew\'s cut sheet, '+esc(R.title)+(R.date?', run '+R.date:'')+'</caption><thead><tr><th scope="col">Point</th><th scope="col">Stake</th><th scope="col">Offset</th>'+(co?'<th scope="col">East</th><th scope="col">North</th>':'')+'<th scope="col">Description</th><th scope="col">Design / hub EL</th><th scope="col">Cut or fill</th></tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';}
function missListHTML(){return G.missing.length?'<p class="small">Marked missing: '+G.missing.map(id=>{const q=G.R.req.find(x=>x.id===id);return '<button class="chip" data-unmiss="'+id+'" aria-label="Remove missing mark at '+esc(q.name)+'">'+esc(q.name)+' ✕</button>';}).join(' ')+'</p>':'';}
function panelHTML(){const R=G.R;if(G.sel==null)return '<p class="empty">Tap a stake in the field to read it.</p>';const st=R.stakes[G.sel];
 let h='<h3>Point '+st.pt+', '+esc(st.name)+'</h3><div class="stage">'+stakeHTML(st,R.flag)+'</div>';
 h+='<p class="small cond">'+(st.bumped?'The lath is leaning and the hub looks chewed up by a tire.':'Lath is straight. Hub looks solid.')+'</p>';
 if(st.grades.length)h+='<div class="row"><button class="btn ghost" id="shotB"'+(st.shot!=null||R.shots<=0?' disabled':'')+'>Take a level shot on the hub</button><span id="shotOut" class="mono" aria-live="polite">'+(st.shot!=null?shotText(st):'')+'</span></div>';
 h+='<fieldset class="call"><legend>Your call on this stake</legend>'+REASONS.map(a=>'<label><input type="radio" name="mk" value="'+a[0]+'"'+(st.mark===a[0]?' checked':'')+'> '+esc(a[1])+'</label>').join('')+'</fieldset>';
 return h;}
function shotText(st){return 'Level shot '+f2(st.shot)+'. Back says EL='+f2(st.hub)+'. Difference '+f2(Math.abs(st.shot-st.hub))+' ft.';}
function callsHTML(){const Q=[['enough','Do we have enough stakes to build it?',['Yes','No']],['sheet','Is the crew\'s cut sheet correct?',['Yes','No']],['written','Was every lath written the way the cut sheet says?',['Yes','No']],['match','Do the stakes match the plan, grades and dimensions?',['Yes','No']],['go','What do you tell the foreman?',['Build it','Stop and call the surveyor']]];
 return Q.map(q=>'<fieldset class="call q"><legend>'+esc(q[1])+'</legend>'+q[2].map((a,j)=>'<label><input type="radio" name="q_'+q[0]+'" value="'+j+'"'+(G.calls[q[0]]===j?' checked':'')+'> '+esc(a)+'</label>').join('')+'</fieldset>').join('');}
function wire(){
 const tb=t=>{G.tab=t;$('#paneC').hidden=t!=='cs';$('#paneP').hidden=t==='cs';$('#tabC').setAttribute('aria-pressed',String(t==='cs'));$('#tabP').setAttribute('aria-pressed',String(t!=='cs'));};$('#tabP').onclick=()=>tb('plan');$('#tabC').onclick=()=>tb('cs');
 $('#newB').onclick=()=>newRound($('#stSel').value,+$('#dfSel').value);
 $('#stSel').onchange=()=>{if(+$('#dfSel').value===4)$('#dfSel').value='1';newRound($('#stSel').value,+$('#dfSel').value);};
 $('#dfSel').onchange=()=>newRound($('#stSel').value,+$('#dfSel').value);
 $('#codeB').onclick=()=>{const c=parseInt($('#codeIn').value,10);if(c>=1000&&c<=9999)newRound($('#stSel').value,+$('#dfSel').value,c);else{$('#codeIn').setAttribute('aria-invalid','true');$('#codeIn').focus();}};
 $('#tapeB').onclick=()=>{const a=G.R.stakes[+$('#tA').value],b=G.R.stakes[+$('#tB').value];if(a===b)return;const noise=[0,0.01,-0.01][Math.floor(Math.random()*3)];
  G.R.tapes.unshift({a:a.pt+' '+a.name,b:b.pt+' '+b.name,d:r2(dist(a.tpos,b.tpos)+noise)});G.R.tapes=G.R.tapes.slice(0,8);$('#tapeLog').innerHTML=tapeLog();};
 $('#missB').onclick=()=>{const id=$('#missSel').value;if(!G.missing.includes(id))G.missing.push(id);$('#missList').innerHTML=missListHTML();wireMiss();};
 wireMiss();wireField();wirePanel();
 document.querySelectorAll('input[name^="q_"]').forEach(i=>i.onchange=()=>{G.calls[i.name.slice(2)]=+i.value;});
 $('#finB').onclick=finish;}
function wireMiss(){document.querySelectorAll('[data-unmiss]').forEach(b=>b.onclick=()=>{G.missing=G.missing.filter(s=>s!==b.dataset.unmiss);$('#missList').innerHTML=missListHTML();wireMiss();$('#missSel').focus();});}
function wireField(){document.querySelectorAll('.fs').forEach(b=>b.onclick=()=>{G.sel=+b.dataset.i;refreshField();$('#panel').innerHTML=panelHTML();wirePanel();const st=G.R.stakes[G.sel];if($('#tA').value!==String(G.sel)){$('#tB').value=$('#tA').value;$('#tA').value=String(G.sel);}const h=$('#panel h3');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});$('#panel').scrollIntoView({block:'nearest',behavior:'smooth'});}});}
function refreshField(){const w=document.querySelector('.fwrap'),sl=w.scrollLeft;w.innerHTML=fieldHTML(G.R);w.scrollLeft=sl;wireField();}
function wirePanel(){const st=G.R.stakes[G.sel];if(!st)return;
 const sb=$('#shotB');if(sb)sb.onclick=()=>{if(G.R.shots<=0||st.shot!=null)return;G.R.shots--;const tru=st.trueHub!=null?st.trueHub:st.hub;st.shot=r2(tru+(st.trueHub!=null?0:[0,0.01,-0.01][Math.floor(Math.random()*3)]));$('#shotOut').textContent=shotText(st);$('#shotsN').textContent=G.R.shots;sb.disabled=true;};
 document.querySelectorAll('input[name="mk"]').forEach(i=>i.onchange=()=>{st.mark=i.value;refreshField();});}

/* ===== scoring ===== */
function finish(){const R=G.R;
 const miss=['enough','sheet','written','match','go'].filter(k=>G.calls[k]==null);
 if(miss.length){$('#finMsg').textContent='Answer all five calls first.';document.querySelector('input[name="q_'+miss[0]+'"]').focus();return;}
 const unread=R.stakes.filter(s=>!s.mark).length;
 const rows=[];let caught=0,reasonOK=0,lost=0,saved=0,falseN=0;
 R.errs.forEach(e=>{const src=e.src==='sheet'?'Bad cut sheet':e.src==='field'?'Set or moved in the field':e.src==='none'?'Never staked':'Lath copied wrong';
  if(e.t==='missing'){const hit=G.missing.includes(e.ids[0]);rows.push({ord:e.ord,name:e.name,src,what:'Missing stake',why:e.why,call:hit?'Marked missing':'Not marked',ok:hit,cost:e.cost});if(hit){caught++;reasonOK++;saved+=e.cost;}else lost+=e.cost;return;}
  const sts=R.stakes.filter(s=>e.ids.includes(s.id));const ms=sts.map(s=>s.mark).filter(m=>m&&m!=='ok');const hit=ms.length>0;const rOK=hit&&ms.some(m=>(OKR[e.t]||[]).includes(m));
  const m0=ms[0]||sts.map(s=>s.mark).find(Boolean);
  rows.push({ord:e.ord,name:e.name,src,what:RNAME[e.t],why:e.why,call:!m0?'No call':m0==='ok'?'Looks good':RNAME[m0]+(rOK?'':' (right stake, different reason)'),ok:hit,cost:e.cost});
  if(hit){caught++;saved+=e.cost;if(rOK)reasonOK++;}else lost+=e.cost;});
 R.stakes.forEach(st=>{if(!st.err&&st.mark&&st.mark!=='ok'){falseN++;rows.push({ord:R.req.findIndex(q=>q.id===st.id),name:st.name,src:'',what:'Nothing wrong',why:'This stake checks against the plan, the sheet and the tape.',call:RNAME[st.mark],ok:false,cost:CALLBACK,fa:true});}});
 G.missing.forEach(id=>{if(!R.errs.some(e=>e.t==='missing'&&e.ids[0]===id)){falseN++;const q=R.req.find(x=>x.id===id);rows.push({ord:q.ord,name:q.name,src:'',what:'Nothing missing',why:'There is a stake at '+q.name+'.',call:'Marked missing',ok:false,cost:CALLBACK,fa:true});}});
 const ans={enough:R.errs.some(e=>e.t==='missing')?1:0,sheet:R.sheetBad?1:0,written:R.writeBad?1:0,match:R.planBad?1:0,go:R.errs.length?1:0};
 const keys=['enough','sheet','written','match','go'];const callsOK=keys.map(k=>G.calls[k]===ans[k]);
 const nE=R.errs.length;
 let score=nE?60*caught/nE+10*reasonOK/nE:70;score+=6*callsOK.filter(Boolean).length;score-=5*falseN;score=Math.max(0,Math.min(100,Math.round(score)));
 const cb=falseN*CALLBACK+(G.calls.go===1&&!nE?CALLBACK:0);
 rows.sort((a,b)=>a.ord-b.ord);
 const missNames=R.errs.filter(e=>e.t==='missing').map(e=>e.name);
 const txt=[['Enough stakes to build it?',ans.enough?'No, '+missNames.join(', ')+(missNames.length>1?' are':' is')+' missing.':'Yes, every required stake is there.'],['Is the cut sheet correct?',ans.sheet?'No. The sheet itself has a bad number, and the field followed it.':'Yes. The sheet matches the plan.'],['Was every lath written the way the sheet says?',ans.written?'No. At least one lath was copied wrong from the sheet.':'Yes. Every lath matches the sheet.'+(ans.sheet?' That does not make them right.':'')],['Do the stakes match the plan?',ans.match?'No. See the problems below.':'Yes.'],['What do you tell the foreman?',ans.go?'Stop and call the surveyor.':'Build it.']];
 $('#results').innerHTML='<section class="card res" aria-labelledby="resH"><h2 id="resH" tabindex="-1">Results: '+score+' out of 100</h2>'+
 '<div class="kpis"><div class="kpi"><span class="kv">'+caught+' of '+nE+'</span><span class="kl">problems caught</span></div><div class="kpi good"><span class="kv">'+money(saved)+'</span><span class="kl">rework avoided</span></div><div class="kpi bad"><span class="kv">'+money(lost)+'</span><span class="kl">rework you would pay for</span></div><div class="kpi"><span class="kv">'+money(cb)+'</span><span class="kl">crew callbacks</span></div></div>'+
 (nE?'':'<p class="clean"><strong>This round was clean.</strong> Every stake checked. Calling the surveyor out on a clean layout costs a callback and a day.</p>')+
 '<h3>The five calls</h3><ul class="calls">'+txt.map((c,i)=>'<li class="'+(callsOK[i]?'y':'n')+'"><strong>'+(callsOK[i]?'Right. ':'Missed. ')+'</strong>'+esc(c[0])+' '+esc(c[1])+'</li>').join('')+'</ul>'+
 (rows.length?'<div class="tscroll"><table class="rt"><caption>Problems and false alarms</caption><thead><tr><th scope="col">Stake</th><th scope="col">Where it went wrong</th><th scope="col">What was there</th><th scope="col">Your call</th><th scope="col">Result</th><th scope="col">Cost</th></tr></thead><tbody>'+
 rows.map(x=>'<tr class="'+(x.ok?'y':'n')+'"><th scope="row">'+esc(x.name)+'</th><td>'+esc(x.src||'Nothing wrong')+'</td><td><strong>'+esc(x.what)+'.</strong> '+esc(x.why)+'</td><td>'+esc(x.call)+'</td><td>'+(x.ok?'Caught':x.fa?'False alarm':'Missed')+'</td><td class="mono">'+(x.ok?'saved '+money(x.cost):money(x.cost))+'</td></tr>').join('')+'</tbody></table></div>':'')+
 (unread?'<p class="small">'+unread+' stake'+(unread>1?'s':'')+' never got a call.</p>':'')+
 '<div class="row"><button class="btn big" id="againB">Next round</button><button class="btn ghost" id="sameB">Replay this round</button>'+(R.diff<3&&score>=80?'<button class="btn ghost" id="upB">Try '+esc(DIFFS[R.diff].name)+'</button>':'')+'</div></section>';
 $('#againB').onclick=()=>newRound(G.style,G.diff);$('#sameB').onclick=()=>newRound(G.style,G.diff,R.code);
 const up=$('#upB');if(up)up.onclick=()=>newRound(G.style,R.diff+1);
 const h=$('#resH');h.focus();h.scrollIntoView({behavior:'smooth',block:'start'});}
/* ===== boot ===== */
function boot(){
 let sd='curb|1';try{sd=localStorage.getItem('layoutgame.sd')||sd;}catch(e){}
 let [st,df]=sd.split('|');df=+df;if(!STYLES.some(s=>s.id===st))st='curb';if(!(df>=1&&df<=4))df=1;
 const th=$('#themeB'),root=document.documentElement;
 const setT=t=>{root.setAttribute('data-theme',t);th.textContent=t==='dark'?'Light':'Dark';th.setAttribute('aria-label','Switch to '+(t==='dark'?'light':'dark')+' mode');try{localStorage.setItem('layoutgame.theme',t);}catch(e){}};
 let t=null;try{t=localStorage.getItem('layoutgame.theme');}catch(e){}
 setT(t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
 th.onclick=()=>setT(root.getAttribute('data-theme')==='dark'?'light':'dark');
 const bb=$('#bigB');bb.onclick=()=>{G.big=!G.big;root.classList.toggle('big',G.big);bb.setAttribute('aria-pressed',String(G.big));};
 newRound(st,df,null);window.scrollTo(0,0);}
if(typeof document!=='undefined')document.addEventListener('DOMContentLoaded',boot);
if(typeof module!=='undefined')module.exports={gen,STYLES,DIFFS,staS,dist};

</script>
