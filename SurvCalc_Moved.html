<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="refresh" content="4;url=https://weygandt.github.io/survcalc/">
<title>SurvCalc Pro has moved</title>
<style>
:root{--bg:#F3F6F8;--card:#FFFFFF;--ink:#0B1B2B;--ink2:#334657;--brand:#0E2A3B;--accent:#F2A900}
@media (prefers-color-scheme:dark){:root{--bg:#0B141C;--card:#13212D;--ink:#EEF3F8;--ink2:#B9C8D6}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:16px;box-sizing:border-box}
main{max-width:440px;background:var(--card);border-radius:16px;padding:28px 24px;box-shadow:0 8px 30px rgba(0,0,0,.12);text-align:center}
.mk{width:56px;height:56px;border-radius:14px;background:var(--accent);display:grid;place-items:center;margin:0 auto 14px}
h1{font-size:24px;margin:0 0 8px}
p{color:var(--ink2);line-height:1.5;margin:0 0 14px}
a.go{display:inline-block;background:var(--brand);color:#FFFFFF;text-decoration:none;font-weight:700;padding:13px 20px;border-radius:12px}
a.go:focus-visible{outline:3px solid #1D6FD8;outline-offset:3px}
small{display:block;margin-top:16px;color:var(--ink2)}
</style>
</head>
<body>
<main>
  <div class="mk" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0E2A3B" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="5.5"/><path d="M12 2.5v5M12 16.5v5M2.5 12h5M16.5 12h5"/></svg></div>
  <h1>SurvCalc Pro has moved</h1>
  <p>Version 4 has a new address. Taking you there now.</p>
  <p><a class="go" href="https://weygandt.github.io/survcalc/">Open SurvCalc Pro version 4</a></p>
  <p>If you added the old version to your home screen, delete that icon and add the new one.</p>
  <small>Developed by Jeff Weygandt, PLS · R&amp;R Engineers | Surveyors</small>
</main>
<script>try{setTimeout(function(){location.replace('https://weygandt.github.io/survcalc/');},2500);}catch(e){}</script>
</body>
</html>
